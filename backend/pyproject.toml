[project]
name = "bidguard-ai-backend"
version = "0.1.0"
description = "Evidence-first tender and contract review API for BidGuard AI"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.0",
    "fastapi>=0.128.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.7.0",
    "pymupdf>=1.25.0",
    "psycopg[binary]>=3.2.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
